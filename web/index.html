<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure Intake · PII Shield</title>
<link rel="stylesheet" href="static/app.css">
</head>
<body>

<header id="banner" class="banner blue">
  <div class="banner-main">
    <div>
      <h1>Secure Intake · <span class="shield">PII Shield</span></h1>
      <p class="sub">AI runs on our own NAI endpoint. No data leaves this environment.</p>
    </div>
    <div class="conn">
      <div class="conn-label" id="conn-label">Connecting…</div>
      <div class="conn-name" id="conn-name">—</div>
      <div class="conn-meta"><span id="conn-host">—</span> · pod <span id="conn-pod">—</span></div>
    </div>
  </div>
</header>

<main>
  <section class="tiles">
    <div class="tile" id="tile-cluster">
      <div class="tile-head"><span class="dot"></span>NKP cluster</div>
      <div class="tile-main" id="cl-main">—</div>
      <div class="tile-sub" id="cl-sub"></div>
    </div>
    <div class="tile" id="tile-nai">
      <div class="tile-head"><span class="dot"></span>NAI endpoint</div>
      <div class="tile-main" id="nai-main">—</div>
      <div class="tile-sub" id="nai-sub"></div>
    </div>
    <div class="tile" id="tile-storage">
      <div class="tile-head"><span class="dot"></span>Storage on Nutanix Cloud Infrastructure</div>
      <div class="tile-main" id="st-main">—</div>
      <div class="tile-sub" id="st-sub"></div>
    </div>
  </section>

  <details class="card settings" id="settings">
    <summary>NAI endpoint settings</summary>
    <form id="set-form" autocomplete="off">
      <label>Endpoint URL
        <input id="set-url" type="url" placeholder="https://nai.example.local/api/v1" required>
      </label>
      <label>API key
        <input id="set-key" type="password" placeholder="leave blank to keep current key">
      </label>
      <label>Model
        <select id="set-model"><option value="">— test connection to load models —</option></select>
      </label>
      <div class="row">
        <button type="button" id="btn-test" class="secondary">Test connection</button>
        <button type="submit" id="btn-save">Save</button>
        <span class="hint" id="set-msg"></span>
      </div>
    </form>
  </details>

  <div class="cols">
    <section class="card intake">
      <h2>Secure intake</h2>
      <textarea id="in-text" maxlength="2000" rows="5"
        placeholder="Type or paste text to scan for personal data…"></textarea>
      <div class="samples">
        Try:
        <button type="button" class="link" data-sample="Visitor Tan Mei Ling, NRIC S1234567D, mobile +65 9123 4512, requests access on Friday.">NRIC</button>
        <button type="button" class="link" data-sample="Quarterly town hall moved to Thursday 3pm in the main auditorium.">no PII</button>
      </div>

      <div id="preview" class="preview" hidden>
        <img id="preview-img" alt="Captured photo preview">
        <button type="button" id="btn-remove" class="secondary small">Remove photo</button>
      </div>
      <input id="file-input" type="file" accept="image/*" capture="environment" hidden>
      <div id="cam-error" class="cam-error" hidden>
        <div id="cam-error-msg"></div>
        <button type="button" id="btn-file" class="link">Choose an image file instead</button>
      </div>

      <div class="row">
        <button type="button" id="btn-photo" class="secondary">📷 Take photo</button>
        <button type="button" id="btn-scan" class="primary">Scan and file</button>
        <span id="spinner" class="spinner" hidden>Scanning on NAI…</span>
      </div>

      <div id="result" class="result" hidden></div>
    </section>

    <section class="card records">
      <h2>Filed records <span class="badge" id="rec-count"></span></h2>
      <ul id="rec-list" class="rec-list"></ul>
    </section>
  </div>
</main>

<div id="camera" class="camera" hidden role="dialog" aria-label="Camera">
  <div class="cam-top">
    <span class="cam-title"><span class="rec-dot"></span>Camera</span>
    <button type="button" id="btn-cam-cancel" class="cam-close" aria-label="Close camera">✕</button>
  </div>
  <div class="cam-stage">
    <video id="cam-video" autoplay playsinline muted></video>
    <img id="cam-still" alt="Captured photo" hidden>
    <div class="cam-frame"></div>
  </div>
  <div class="cam-controls">
    <div class="cam-left">
      <button type="button" id="btn-cam-switch" class="cam-side" hidden>⟲ Switch camera</button>
      <button type="button" id="btn-retake" class="cam-side" hidden>Retake</button>
    </div>
    <button type="button" id="btn-capture" class="shutter" aria-label="Take photo"></button>
    <div class="cam-right">
      <button type="button" id="btn-use" class="primary" hidden>Use photo</button>
    </div>
  </div>
</div>

<footer><span id="version"></span></footer>
<script src="static/app.js"></script>
</body>
</html>
